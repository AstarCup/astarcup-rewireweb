name: Frontend Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build astarcup-rewireweb
    runs-on: ubuntu-latest
    # 前端构建期环境变量（Vite 构建时内联到产物）。
    # 可在仓库 Settings → Secrets and variables → Actions 中配置同名 Variables 覆盖默认值。
    env:
      VITE_BACKEND: ${{ vars.VITE_BACKEND || 'http://localhost:3000' }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'Astracup' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astarcup-rewireweb-dist
          path: dist
          if-no-files-found: error
