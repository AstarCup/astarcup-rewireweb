<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23e85d75'/><text x='50' y='66' font-size='52' font-family='sans-serif' font-weight='bold' fill='%23fdf6ee' text-anchor='middle'>A</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Astracup — 星域来了" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdf6ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17130e" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Astracup" />
    <meta property="og:description" content="Astracup — 星域来了" />
    <meta property="og:type" content="website" />
    <title>Astracup</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
